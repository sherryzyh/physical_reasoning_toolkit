[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-reasoning-toolkit"
version = "0.2.0"
description = "A toolkit for physical-reasoning datasets, multi-provider LLM inference, answer evaluation, and annotation."
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
authors = [
    {name = "Yinghuan Zhang", email = "yinghuan.flash@gmail.com"}
]
keywords = [
    "physics",
    "physical-reasoning",
    "llm",
    "evaluation",
    "benchmark",
    "datasets",
    "annotation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.1",
    "numpy>=2.2.6",
    "openai>=1.99.9",
    "anthropic>=0.49.0",
    "pydantic>=2.11.7",
    "tqdm>=4.67.1",
    # Ceiling on the vendor's own instruction: the 3.0 release notes list
    # breaking removals and say to pin < 3.0.0. prkit had no upper bound and CI
    # installs unpinned, so 3.0 would have landed in CI the day it shipped.
    # Floor is the oldest version prkit has actually been run against; >=1.0.0
    # was never verified, and the retry normalization needs types.HttpRetryOptions.
    "google-genai>=2.9.0,<3.0.0",
    "sympy>=1.14.0",
    "python-dotenv>=1.0.0",
    "latex2sympy2-extended>=1.0.0",
    "pyarrow>=14.0.0",
    "datasets>=2.14.0",
    "Pillow>=10.0.0",
    "ollama>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Gate tools are pinned exactly: their version decides pass/fail, so a
    # floating ``>=`` lets a fresh CI install silently drift from local and
    # break the build (a new ruff/black reformats, a new mypy newly-errors).
    # Bump these deliberately, not by accident. Keep them in sync with the venv.
    "black==26.1.0",
    "ruff==0.15.17",
    "mypy==1.19.1",
    "pre-commit>=3.5.0",
    "twine>=6.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "myst-parser>=1.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
annotation = [
    "streamlit>=1.28.0",
]
baselines = [
    "pint>=0.25",
]
freshness = [
    # Embedding-recall stage of the contamination/overlap report (X3 sub-feature B).
    # Optional: the n-gram stage and provenance/variant paths need only core deps.
    "sentence-transformers>=2.2.0",
]
all = [
    "physical-reasoning-toolkit[dev,docs,annotation,baselines,freshness]",
]

[project.urls]
Homepage = "https://github.com/sherryzyh/physical_reasoning_toolkit"
Documentation = "https://github.com/sherryzyh/physical_reasoning_toolkit#readme"
Repository = "https://github.com/sherryzyh/physical_reasoning_toolkit"
Issues = "https://github.com/sherryzyh/physical_reasoning_toolkit/issues"
Changelog = "https://github.com/sherryzyh/physical_reasoning_toolkit/blob/main/CHANGELOG.md"

[project.scripts]
prkit = "prkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prkit*"]

[tool.setuptools.package-data]
prkit = ["py.typed"]
"prkit.annotation.tasks.correctness.ui" = [
    "vendor/katex/*",
    "vendor/katex/fonts/*",
]
# Ship the verbatim upstream attribution alongside each vendored baseline (the
# extension-less LICENSE/NOTICE are not covered by the "*.md/.txt/.rst" glob below).
"prkit.evaluation.baselines.phybench_eed" = ["LICENSE", "PROVENANCE.md"]
"prkit.evaluation.baselines.cmphysbench_seed" = ["LICENSE", "NOTICE", "PROVENANCE.md"]
"*" = ["*.txt", "*.md", "*.rst"]

[tool.black]
line-length = 88
target-version = ['py312']
# Vendored baselines are upstream forks kept close to source for auditability —
# never reformatted. force-exclude applies even to explicitly-passed (pre-commit) paths.
force-exclude = "src/prkit/evaluation/baselines/"

[tool.ruff]
line-length = 88
target-version = "py312"
# "/build" is anchored to the repo root so it excludes the setuptools build/ artifact
# dir WITHOUT excluding the src/prkit/semantics/build package (gitignore semantics: a
# bare "build" would match any directory of that name at any depth). The vendored
# baselines are upstream forks kept close to source for auditability — never linted.
extend-exclude = ["/build", "dist", "htmlcov", "src/prkit/evaluation/baselines"]
# force-exclude makes the excludes authoritative even when pre-commit passes the
# vendored paths explicitly (they live under the linted src/prkit/ tree).
force-exclude = true

[tool.ruff.lint]
# E501 (line length) is owned by black. Bugbear (B) is deferred to a later pass.
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# __init__.py modules deliberately re-export names for the public API.
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Vendored baselines are upstream forks (untyped, star-imports) kept close to source
# for auditability — not type-checked. Errors there are suppressed even when the
# scorers import the pure core.
[[tool.mypy.overrides]]
module = "prkit.evaluation.baselines.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "datasets",
    "datasets.*",
    "inspect_ai",
    "inspect_ai.*",
    "latex2sympy2_extended",
    "latex2sympy2_extended.*",
    "pandas",
    "pandas.*",
    "pyarrow",
    "pyarrow.*",
    "requests",
    "requests.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "streamlit",
    "streamlit.*",
    "sympy",
    "sympy.*",
    "tqdm",
    "tqdm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=prkit",
    "--cov-fail-under=60",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    # The evaluation comparator/evaluator stacks are intentionally deprecated in
    # favor of prkit.scoring.SemanticsScorer; silence their DeprecationWarnings so
    # the existing eval tests stay green even under `-W error`. Matched by message
    # (robust to stacklevel) since every such warning points at prkit.scoring.
    "ignore:.*prkit.scoring.*:DeprecationWarning",
]
